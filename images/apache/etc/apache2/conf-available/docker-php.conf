# Allow the Authorization header to pass through to PHP-FPM natively
# With fallback for mechanism specifically for Jessie-era Apache
<Directory "/">
    <IfModule mod_version.c>
        <IfVersion >= 2.4.13>
            CGIPassAuth On
        </IfVersion>
        <IfVersion < 2.4.13>
            <IfModule mod_rewrite.c>
                RewriteEngine On
                RewriteCond %{HTTP:Authorization} .
                RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
            </IfModule>
        </IfVersion>
    </IfModule>
</Directory>

# PHP-FPM
<FilesMatch \.php$>
    SetHandler "proxy:fcgi://127.0.0.1:9000"
</FilesMatch>

# Basic Configuration
DirectoryIndex disabled
DirectoryIndex index.php index.html
<Directory /var/www/>
    Options -Indexes
    AllowOverride All
</Directory>

# Healthchecks: Set /healthcheck to be the healthcheck URL
ProxyPass "/healthcheck" "fcgi://localhost:9000/healthcheck"
ProxyPassReverse "/healthcheck" "fcgi://localhost:9000"

# Set the Proxy Timeout to be 30 minutes
ProxyTimeout 1800

# Set environment variable for healthcheck requests
SetEnvIf Request_URI "^/healthcheck$" dontlog

# CustomLog directive to conditionally log requests (combined log, sent to stdout for Docker)
LogFormat "%l %u %t %v %a \"%r\" %>s %b" commonvhost
CustomLog ${APACHE_LOG_DIR}/access.log commonvhost env=!dontlog
CustomLog /proc/self/fd/1 commonvhost env=!dontlog
ErrorLog ${APACHE_LOG_DIR}/error.log
ErrorLog /proc/self/fd/2

# Configure Log Level
LogLevel ${LOG_LEVEL}

#
# Security
#

# Disable Server Signature for increased security
# https://httpd.apache.org/docs/current/mod/core.html#serversignature
ServerSignature Off

# Minimize information sent about the server
# https://httpd.apache.org/docs/current/mod/core.html#servertokens
ServerTokens Prod

# Disable TRACE HTTP method to prevent XST attacks
# https://owasp.org/www-community/attacks/Cross_Site_Tracing
# https://github.com/h5bp/server-configs-apache/blob/main/h5bp/security/trace_method.conf
TraceEnable Off

# Disable X-Powered-By
# https://github.com/h5bp/server-configs-apache
Header unset X-Powered-By
Header always unset X-Powered-By

# Prevent clickjacking attacks by disabling iframe embedding
# https://owasp.org/www-project-secure-headers/#x-frame-options
# https://github.com/h5bp/server-configs-apache/blob/main/h5bp/security/x-frame-options.conf
Header always set X-Frame-Options "SAMEORIGIN"

# Prevent MIME type sniffing attacks
# https://owasp.org/www-project-secure-headers/#x-content-type-options
# https://github.com/h5bp/server-configs-apache/blob/main/h5bp/security/x-content-type-options.conf
Header always set X-Content-Type-Options "nosniff"

# Control referrer information sent with requests
# https://owasp.org/www-project-secure-headers/#referrer-policy
# https://github.com/h5bp/server-configs-apache/blob/main/h5bp/security/referrer-policy.conf
Header always set Referrer-Policy "strict-origin-when-cross-origin"

# Enable HTTP Strict Transport Security (HSTS)
# https://owasp.org/www-project-secure-headers/#strict-transport-security
# https://github.com/h5bp/server-configs-apache/blob/main/h5bp/security/strict-transport-security.conf
Header always set Strict-Transport-Security "max-age=16070400; includeSubDomains"

# Block access to all hidden files and directories (dotfiles)
# EXCEPT for the "/.well-known/" directory which is required by RFC 8615
# for ACME challenges, security.txt, and other standardized endpoints.
# https://www.rfc-editor.org/rfc/rfc8615
# https://github.com/h5bp/server-configs-apache/blob/main/h5bp/security/file_access.conf
<DirectoryMatch "/\.(?!well-known/)">
    Require all denied
</DirectoryMatch>

# Block access to files that may expose sensitive information
# Based on H5BP server configs: https://github.com/h5bp/server-configs-apache
<FilesMatch "(^#.*#|\.(bak|conf|config|dist|inc|ini|log|sh|sql|sw[op])|~)$">
    Require all denied
</FilesMatch>

# Disable XML-RPC for WordPress security
<Files xmlrpc.php>
   Require all denied
</Files>